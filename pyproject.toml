[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atmos-weather-mcp"
version = "0.2.0"
description = "FastMCP weather tools over the keyless Open-Meteo API, with transparent decision rules."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["atmos"]

[tool.ruff]
line-length = 100
target-version = "py310"
